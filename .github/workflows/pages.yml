name: Publish client review screens

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'OptimIQ_Portal_Login_Concept.html'
      - 'OptimIQ_Consultant_Terms_Declarations.html'
      - 'OptimIQ_Consultant_Profile_CTQ_Stepper.html'
      - 'OptimIQ_Client_Workspace_Concept.html'
      - 'OptimIQ_Consultant_Workspace_Concept.html'
      - 'OptimIQ_Consulting_Firm_Workspace_Concept.html'
      - 'OptimIQ_Admin_Workspace_Concept.html'
      - 'portal-demo.css'
      - '*.png'
      - '*.xlsx'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Assemble the HTML and CSS client review site
        run: |
          mkdir _site
          cp index.html OptimIQ_Portal_Login_Concept.html OptimIQ_Consultant_Terms_Declarations.html OptimIQ_Consultant_Profile_CTQ_Stepper.html OptimIQ_Client_Workspace_Concept.html OptimIQ_Consultant_Workspace_Concept.html OptimIQ_Consulting_Firm_Workspace_Concept.html OptimIQ_Admin_Workspace_Concept.html portal-demo.css OptimIQ_Consultus_Logo.png OptimIQ_Short_logo.png OptimIQ_Portal_Screen_Approval_Inventory.xlsx _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
