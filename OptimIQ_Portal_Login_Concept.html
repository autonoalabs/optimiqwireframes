<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OptimIQ Consultus shared portal sign-in screen concept for client review.">
  <title>Portal sign-in — OptimIQ Consultus</title>
  <link rel="stylesheet" href="portal-demo.css">
  <style>
    body { min-width: 320px; min-height: 100vh; background: #f5f8f6; }
    .login-page { display: grid; min-height: 100vh; grid-template-columns: minmax(320px, .92fr) minmax(420px, 1.08fr); background: #fbfcfb; }
    .brand-panel { position: relative; display: grid; min-height: 100vh; place-items: center; overflow: hidden; padding: clamp(26px, 5vw, 68px); color: #eaf6f1; background: radial-gradient(circle at 80% 82%, rgb(55 167 138 / 16%), transparent 34%), linear-gradient(145deg, #052b25, #0c4036); }
    .brand-panel::after { position: absolute; right: -105px; bottom: 100px; width: 350px; aspect-ratio: 1; border: 1px solid rgb(141 197 177 / 15%); border-radius: 50%; content: ""; box-shadow: 0 0 0 30px rgb(141 197 177 / 4%), 0 0 0 70px rgb(141 197 177 / 3%); pointer-events: none; }
    .brand-logo { position: relative; z-index: 1; width: min(100%, 260px); padding: 12px; border-radius: 14px; background: #e0f1eb; }
    .eyebrow { margin: 0 0 10px; color: #23856f; font-size: 11px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .form-panel { display: grid; place-items: center; padding: 38px clamp(22px, 6vw, 82px); }
    .form-wrap { width: min(100%, 440px); }
    .form-wrap .eyebrow { color: #23856f; }
    .form-wrap h2 { margin: 0; color: #062f29; font-size: clamp(30px, 3vw, 38px); letter-spacing: -.04em; }
    .subtitle { margin: 9px 0 24px; color: #637a72; font-size: 14px; }
    .login-form { display: grid; gap: 9px; }
    .login-form label { color: #092e28; font-size: 12px; font-weight: 750; }
    .login-form input { width: 100%; min-height: 48px; margin-bottom: 8px; padding: 0 13px; border: 1px solid #cfded7; border-radius: 10px; color: #092e28; background: #fff; font: inherit; font-size: 13px; }
    .login-form input::placeholder { color: #91a39b; }
    .login-form input:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid rgb(55 167 138 / 35%); outline-offset: 2px; }
    .password-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .password-label a { color: #23856f; font-size: 12px; font-weight: 700; text-decoration: none; }
    .password-label a:hover { text-decoration: underline; }
    .sign-in { min-height: 49px; margin-top: 4px; border: 0; border-radius: 10px; color: #fff; background: #0c604f; font: inherit; font-size: 14px; font-weight: 800; cursor: default; }
    @media (max-width: 760px) { .login-page { grid-template-columns: 1fr; } .brand-panel { min-height: 180px; padding: 23px 20px; } .brand-logo { width: 190px; } .form-panel { padding: 30px 20px 40px; } }
    @media (max-width: 420px) { .brand-panel { padding: 18px 15px; } .form-panel { padding-inline: 15px; } .brand-logo { width: 165px; } }
  </style>
  <link rel="stylesheet" href="theme1-typography.css">
<link rel="stylesheet" href="consultant-demo.css?v=consultant-ux-20261024a">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="OptimIQ Consultus shared portal">
      <img class="brand-logo" src="OptimIQ_Consultus_Logo.png" alt="OptimIQ Consultus">
    </section>
    <section class="form-panel" aria-labelledby="login-heading">
      <div class="form-wrap">
        <p class="eyebrow">Member portal</p>
        <h2 id="login-heading">Welcome back</h2>
        <p class="subtitle">Sign in to continue to your workspace.</p>
        <form class="login-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="name@company.com">
          <div class="password-label"><label for="password">Password</label><a href="#reset-password" data-reset-password>Forgot password?</a></div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
          <button class="sign-in" type="button">Sign in</button>
        </form>
      </div>
    </section>
  </main>
<script src="consultant-demo.js?v=consultant-ux-20261024a" defer></script>
</body>
</html>
